# Tier-1 comparison cell — M3 N=4000 RF=8 s=3: P(bad) pred 0.197, MC 195/1000 = 0.195.
# mu = 0.2; run count matched to the formal MC row (or sized for the bulk value).

model = "m3"
master_seed = 504

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 8
publisher = { pick_count = 2 }
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 8
publisher = { pick_count = 2 }
fanout = "silent-relay"

[execution]
runs_per_experiment = 1000
