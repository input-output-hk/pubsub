# Gated-symmetric, gate only - B = 125: the direct pair-density check.
#
# No pick count: every gate survivor is dialed, both ends agree on the
# survivor set (edge-sym pair draw), so realised degree = the pool exactly.
# Predicted d = (N-1)/B = 31.99 - this cell measures N-039's per-pair 1/B
# density assumption with no pick mechanics in the way. Isolation is the
# exact empty-pool law (1 - 1/B)^(H-1): E_iso = 2.2e-8, no measurable tail.
# 500 runs: degree geometry.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gate-only-b125.toml --out results/gated-symmetric/gate-only-b125/

model = "m4"
master_seed = 1106

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
bucket_count = 125 # gate only: no pick_count, every survivor dialed
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 125
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 500
