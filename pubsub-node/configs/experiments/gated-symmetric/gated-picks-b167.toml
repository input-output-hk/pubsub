# Gated-symmetric ladder - K = 16, B = 167: r = 1.5, inside the empty-pool
# regime.
#
# Survivor pool mean (N-1)/B = 23.9 - just above the delta = 1e-4 pool
# floor ln(H/delta)/(1-mu) = 21.6 (B = 167 satisfies B <= 185). Predicted
# realised mean degree d = 21.26 (pick truncation starts: own picks 15.92);
# isolation E_iso = 1.45e-5, empty-pool dominated, ~0.007 expected bad runs
# here. 500 runs: degree geometry.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gated-picks-b167.toml --out results/gated-symmetric/gated-picks-b167/

model = "m4"
master_seed = 1104

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 167
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 16
bucket_count = 167
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 500
