# Gated-symmetric ladder - K = 16, B = 50: comfortable headroom (r = 5).
#
# Survivor pool mean (N-1)/B = 80. Predicted realised mean degree d = 28.80
# (mutual-pick overlap lambda*m^2 = 3.2 links); isolation channel-B
# dominated at E_iso = 7.9e-13 - no measurable tail. This cell sits just
# above the channel crossover (r = 3.01, B = 83) where the gated-symmetric
# tail becomes equivalent to ungated M4 at the same K. 500 runs:
# degree geometry.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gated-picks-b50.toml --out results/gated-symmetric/gated-picks-b50/

model = "m4"
master_seed = 1102

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 50
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 16
bucket_count = 50
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 500
