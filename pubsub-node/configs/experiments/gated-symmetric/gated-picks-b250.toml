# Gated-symmetric tail cell - K = 16, B = 250: r = 1, the discriminating
# point.
#
# Survivor pool mean (N-1)/B = 16 = the pick budget, so a node links
# essentially its whole pool (predicted d = 15.84; own picks truncate to
# 14.41). The two candidate laws separate by ~520x here:
#
#   - pair-correlated (empty-pool channel): a node is stranded iff its pool
#     holds no honest member - one draw kills both directions at once.
#     E_iso = 3200 * 2.70e-6 = 0.0086 -> ~69 bad runs expected in 8 000.
#   - the ungated M4 law read at realised degree (two independent factors,
#     mu^RF * e^(-RF(1-mu)) at RF = d/2): 1.65e-5 -> ~0.13 bad runs.
#
# The matched-degree ungated twin (ungated-twin-k8.toml) provides the
# empirical control at the same mean degree. 8 000 runs.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gated-picks-b250.toml --out results/gated-symmetric/gated-picks-b250/

model = "m4"
master_seed = 1107

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 250
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 16
bucket_count = 250
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 8000
