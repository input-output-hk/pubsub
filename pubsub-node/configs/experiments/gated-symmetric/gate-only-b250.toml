# Gated-symmetric tail cell, gate only - B = 250: the same predicted point
# as gated-picks-b250 without pick mechanics.
#
# Every survivor dialed: d = pool = 16.00 exactly, and isolation is the
# exact empty-pool law (1 - 1/B)^(H-1) = 2.70e-6: E_iso = 0.0086, the same
# prediction as the picked cell (at r = 1 the picks barely truncate the
# pool, so the two cells should agree in the tail while differing 1% in
# degree). Agreement here pins the tail on the pair-draw geometry itself,
# not on the pick rule. 8 000 runs.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gate-only-b250.toml --out results/gated-symmetric/gate-only-b250/

model = "m4"
master_seed = 1108

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
bucket_count = 250 # gate only: no pick_count, every survivor dialed
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 250
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 8000
