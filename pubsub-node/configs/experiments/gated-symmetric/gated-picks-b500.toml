# Gated-symmetric ladder - K = 16, B = 500: r = 0.5, the pool-clique
# regime.
#
# Survivor pool mean (N-1)/B = 8 - half the pick budget, so nodes link
# their whole pool mutually and the pick count stops mattering: predicted
# realised mean degree d = 8.00 = the pool itself. Isolation is the pure
# empty-pool event: E_iso = 5.29, P(bad) = 0.995 - essentially every run
# strands someone. The far edge of the B trade-off, at 500 runs (bulk-scale
# either way; no tail statistics needed).
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gated-picks-b500.toml --out results/gated-symmetric/gated-picks-b500/

model = "m4"
master_seed = 1105

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 500
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 16
bucket_count = 500
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 500
