# Ungated M4 control - K = 8: the matched-degree twin for the B = 250 tail
# cells.
#
# Plain M4 (no gate) at pick count 8: predicted realised mean degree
# d = 15.98 - the same mean degree the gated B = 250 cells realise, at a
# tenth of their compute. Ungated isolation keeps the two-factor product
# law (all 8 picks adversarial AND no honest inbound): E_iso = 1.32e-5,
# ~0.11 bad runs expected in 8 000 (an all-good sample bounds it at
# Wilson <= 4.8e-4, still 18x under the gated cells' 0.0086). Side by side
# with gated-picks-b250 this turns the pair-correlation penalty into a raw
# count comparison at equal degree, with no closed form on either side.
# 8 000 runs.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/ungated-twin-k8.toml --out results/gated-symmetric/ungated-twin-k8/

model = "m4"
master_seed = 1109

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 8
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 8
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 8000
