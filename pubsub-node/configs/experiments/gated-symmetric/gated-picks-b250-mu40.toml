# Gated-symmetric mu axis - K = 16, B = 250 at mu = 0.4: the empty-pool
# exponent's (1-mu) dependence, second step.
#
# Same cell as gated-picks-b250 at adversarial fraction 0.4 - two
# geometric steps of e^(0.1*16) = 4.95 above the mu = 0.2 cell, aligning
# with the churn study's validated mu_eff range. Exact prediction
# (gated_symmetric_predictions.py 0.4): d = 15.84 (class-blind gate),
# isolation 6.671e-5, E_iso = 0.1601, P(bad) = 0.1479 -> ~74 bad runs
# expected in 500, equal statistical weight to the other two mu points.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gated-picks-b250-mu40.toml --out results/gated-symmetric/gated-picks-b250-mu40/

model = "m4"
master_seed = 1111

[population]
size = 4000
adversarial_fraction = 0.4
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 250
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 16
bucket_count = 250
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 500
