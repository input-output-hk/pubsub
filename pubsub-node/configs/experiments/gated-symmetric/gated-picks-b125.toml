# Gated-symmetric ladder - K = 16, B = 125: r = 2, the directional
# families' law-exact headroom point.
#
# Survivor pool mean (N-1)/B = 32. Predicted realised mean degree d = 24.00:
# unlike the directional plane (E10: B invisible at r >= 2), here B enters
# the degree itself - the mutual-pick overlap lambda*m^2 = 8.0 links erases
# a quarter of the 2K = 32 ungated degree at the same K. Isolation is
# empty-pool (channel A) dominated at E_iso = 2.2e-8 - far above ungated M4
# at this K (5e-14) but not measurable; the tail cells sit at B = 250.
# 500 runs: degree geometry.
#
# Run manually:
#
#   experiments --config configs/experiments/gated-symmetric/gated-picks-b125.toml --out results/gated-symmetric/gated-picks-b125/

model = "m4"
master_seed = 1103

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 125
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 16
bucket_count = 125
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 500
