# Symmetric flooding degeneracy check: B = 250, budget C = 3, S = 40.
#
# At pool saturation (m ~ 0.90) nearly every edge is mutual and almost
# nothing is fresh — the flooding surface vanishes structurally: every
# load carries a (1-m) factor. This pair (with the S = 800 twin) checks
# the degeneracy rather than gridding nine near-empty cells. Predictions
# (symmetric_flooding_predictions.py `250 40 3 budget`), per honest
# victim: routes h(own/mut/adm) = 1.41/12.86/1.41, s(floor/adm) =
# 0.14/0.016; race admitted h/s = 0.970/0.011, refused h/s =
# 0.441/0.005, P(>=1 honest refusal) = 0.164; crossing refusals = 0,
# admitted <= 3, degree <= 19; d ~14.95, Sybil edges ~0.16. Coverage:
# E18 E_iso = 5.1e-4 (the empty-pool channel active at B = 250) ->
# P(bad) ~ 5.1e-4, predict ~399.8/400 good in expectation.
#
# Run manually:
#
#   experiments --config configs/experiments/symmetric-flooding/degeneracy-b250-cap3-s40.toml --out results/symmetric-flooding/degeneracy-b250-cap3-s40/ --per-node-detail

model = "m4"
master_seed = 1131

[population]
size = 4000
adversarial = 40
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 250
symmetric = true
accept_cap = 3
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 250 # no pick_count: every admissible pair is dialed
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 400
