# Symmetric flooding grid cell: B = 50, budget C = 26, S = 400 (10 %).
#
# One cell of the B x cap x S core grid around the pilot
# (pilot-b125-cap12-s800.toml documents the scenario). Predictions
# (symmetric_flooding_predictions.py `50 400 26 budget`, the
# pilot-calibrated race), per honest victim: routes h(own/mut/adm) =
# 11.52/2.88/11.52, s(floor/adm) = 1.60/6.40; race admitted h/s =
# 11.470/6.372, refused h/s = 0.050/0.027, P(>=1 honest refusal) = 0.031;
# crossing refusals = 0, admitted <= 26, degree <= 42; d ~33.79, Sybil
# edges ~7.97; E_iso ~3e-18 -> predict 400/400 good.
#
# Run manually:
#
#   experiments --config configs/experiments/symmetric-flooding/b50-cap26-s400.toml --out results/symmetric-flooding/b50-cap26-s400/ --per-node-detail

model = "m4"
master_seed = 1121

[population]
size = 4000
adversarial = 400
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 50
symmetric = true
accept_cap = 26
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 50 # no pick_count: every admissible pair is dialed
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 400
