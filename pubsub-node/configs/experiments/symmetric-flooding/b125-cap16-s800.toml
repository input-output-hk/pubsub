# Symmetric flooding grid cell: B = 125, budget C = 16, S = 800 (20 %).
#
# One cell of the B x cap x S core grid around the pilot
# (pilot-b125-cap12-s800.toml documents the scenario). Predictions
# (symmetric_flooding_predictions.py `125 800 16 budget`, the
# pilot-calibrated race), per honest victim: routes h(own/mut/adm) =
# 6.40/6.40/6.40, s(floor/adm) = 3.20/3.20; race admitted h/s =
# 6.320/3.161, refused h/s = 0.078/0.039, P(>=1 honest refusal) = 0.047;
# crossing refusals = 0, admitted <= 16, degree <= 32; d ~25.40, Sybil
# edges ~6.36; E_iso ~2e-08 -> predict 400/400 good.
#
# Run manually:
#
#   experiments --config configs/experiments/symmetric-flooding/b125-cap16-s800.toml --out results/symmetric-flooding/b125-cap16-s800/ --per-node-detail

model = "m4"
master_seed = 1130

[population]
size = 4000
adversarial = 800
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 125
symmetric = true
accept_cap = 16
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 125 # no pick_count: every admissible pair is dialed
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 400
