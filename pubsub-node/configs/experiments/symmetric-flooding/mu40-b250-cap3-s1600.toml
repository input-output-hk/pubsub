# Symmetric flooding mu-composition spot-check: B = 250, budget C = 3,
# S = 1600 (mu = 0.4 flooder — the calibrated elevated-mu population
# turns flooder, at the pool floor's edge).
#
# The one elevated-mu cell (the mu-axis rule: compositions of validated
# laws get a spot-check, not an axis): does the cap leave the E18
# empty-pool channel untouched where it is measurably active?
# Predictions (symmetric_flooding_predictions.py `250 1600 3 budget`),
# per honest victim: routes h(own/mut/adm) = 0.86/7.79/0.86, s(floor/adm)
# = 5.77/0.63; race admitted h/s = 0.576/0.426, refused h/s =
# 0.280/0.207, P(>=1 honest refusal) = 0.171; crossing refusals = 0,
# admitted <= 3, degree <= 19; d ~15.14, Sybil edges ~6.19. Coverage:
# E18 E_iso = 0.160 at (1-mu)(N-1)/B = 9.6 -> P(bad) ~ 0.148, predict
# ~341/400 good — the empty-pool law at mu = 0.4, predicted unchanged
# by the cap (pre-acceptance geometry; starvation adds at most a
# second-order term at these refusal rates).
#
# Run manually:
#
#   experiments --config configs/experiments/symmetric-flooding/mu40-b250-cap3-s1600.toml --out results/symmetric-flooding/mu40-b250-cap3-s1600/ --per-node-detail

model = "m4"
master_seed = 1133

[population]
size = 4000
adversarial = 1600
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 250
symmetric = true
accept_cap = 3
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 250 # no pick_count: every admissible pair is dialed
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 400
