# Symmetric flooding grid cell: B = 50, budget C = 26, S = 40 (control).
#
# One cell of the B x cap x S core grid around the pilot
# (pilot-b125-cap12-s800.toml documents the scenario). Predictions
# (symmetric_flooding_predictions.py `50 40 26 budget`, the
# pilot-calibrated race), per honest victim: routes h(own/mut/adm) =
# 12.67/3.17/12.67, s(floor/adm) = 0.16/0.64; race admitted h/s =
# 12.670/0.640, refused h/s = 0.0015/0.0001, P(>=1 honest refusal) =
# 0.0008 (the generous cap clears the control load — the E12
# prerequisite); crossing refusals = 0, admitted <= 26, degree <= 42;
# d ~29.31, Sybil edges ~0.80; E_iso ~0 -> predict 400/400 good.
#
# Run manually:
#
#   experiments --config configs/experiments/symmetric-flooding/b50-cap26-s40.toml --out results/symmetric-flooding/b50-cap26-s40/ --per-node-detail

model = "m4"
master_seed = 1120

[population]
size = 4000
adversarial = 40
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 50
symmetric = true
accept_cap = 26
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 50 # no pick_count: every admissible pair is dialed
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 400
