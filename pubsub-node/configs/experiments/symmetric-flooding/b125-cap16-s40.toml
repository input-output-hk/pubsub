# Symmetric flooding grid cell: B = 125, budget C = 16, S = 40 (control).
#
# One cell of the B x cap x S core grid around the pilot
# (pilot-b125-cap12-s800.toml documents the scenario). Predictions
# (symmetric_flooding_predictions.py `125 40 16 budget`, the
# pilot-calibrated race), per honest victim: routes h(own/mut/adm) =
# 7.92/7.92/7.92, s(floor/adm) = 0.16/0.16; race admitted h/s =
# 7.889/0.159, refused h/s = 0.029/0.001, P(>=1 honest refusal) = 0.014
# (the generous cap clears the control load — the E12 prerequisite);
# crossing refusals = 0, admitted <= 16, degree <= 32; d ~24.02, Sybil
# edges ~0.32; E_iso ~6e-11 -> predict 400/400 good.
#
# Run manually:
#
#   experiments --config configs/experiments/symmetric-flooding/b125-cap16-s40.toml --out results/symmetric-flooding/b125-cap16-s40/ --per-node-detail

model = "m4"
master_seed = 1128

[population]
size = 4000
adversarial = 40
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 125
symmetric = true
accept_cap = 16
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 125 # no pick_count: every admissible pair is dialed
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 400
