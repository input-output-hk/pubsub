# E10 Family B - gate + pick count: K = 16, B = 500, survivor headroom
# r = (N-1)/(B*K) = 0.5.
#
# Same design as gated-picks-b10.toml deep past the critical headroom: mean
# ~8 survivors, pick_count almost never binds, and the cell should be
# statistically indistinguishable from gate-only-b500.toml (the Family-A
# cell at the same B, different master seed) - the designed consistency
# check between the two families. 4 000 runs.
#
# Run manually:
#
#   experiments --config configs/experiments/selection-fidelity/gated-picks-b500.toml --out results/e10/gated-picks-b500/

model = "m2"
master_seed = 917

[population]
size = 4000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 500
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 16
bucket_count = 500
fanout = "silent-relay"

[execution]
runs_per_experiment = 4000
