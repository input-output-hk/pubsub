# Cost/latency/degree comparison cell — M3 operating point RF=12 s=8 (comparison.md section 2 row: 153570 msgs, 9.6 copies/honest, hops 5.9 full / 4.3 mean).
# N = 20000, mu = 0.2; 200 runs (the published values were measured over
# 40-200 graphs per cell).

model = "m3"
master_seed = 841

[population]
size = 20000
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 12
publisher = { pick_count = 7 }
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 12
publisher = { pick_count = 7 }
fanout = "silent-relay"

[execution]
runs_per_experiment = 2000

# The adversarial fraction is an assumption about the deployment rather than a
# result, and the designs do not degrade at equal rates in it. This sweeps the
# law's own argument: mu is a native parameter, so what is tested is whether
# each law holds across it at fixed selection parameters.
[[axes]]
parameter = "adversarial_fraction"
values = [0.30, 0.35, 0.40]
