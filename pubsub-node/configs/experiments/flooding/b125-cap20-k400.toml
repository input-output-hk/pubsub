# E12 flooding grid cell: B = 125, accept cap 20, K = 400 Sybils.
#
# One cell of the 4 x 3 x 4 (B x cap x Sybil-count) grid around the pilot
# (pilot-b125-cap24-k200.toml, which documents the scenario). Prediction:
# attacker-held slots per victim ~ K/B = 3.20 mean. Runs sized 150
# (means and modest tails). Measurement needs --per-node-detail.
#
# Run manually:
#
#   experiments --config configs/experiments/flooding/b125-cap20-k400.toml --out results/e12/b125-cap20-k400/ --per-node-detail

model = "m2"
master_seed = 1007

[population]
size = 4000
adversarial = 400
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 125
accept_cap = 20
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 125 # no pick_count: every valid edge is dialed
fanout = "silent-relay"

[execution]
runs_per_experiment = 150
