# E12 flooding grid cell: B = 500, accept cap 20, K = 800 Sybils.
#
# One cell of the 4 x 3 x 4 (B x cap x Sybil-count) grid around the pilot
# (pilot-b125-cap24-k200.toml, which documents the scenario). Prediction:
# attacker-held slots per victim ~ K/B = 1.60 mean. Runs sized 400
# (the saturating-regime tail treatment). Measurement needs --per-node-detail.
#
# Run manually:
#
#   experiments --config configs/experiments/flooding/b500-cap20-k800.toml --out results/e12/b500-cap20-k800/ --per-node-detail

model = "m2"
master_seed = 1016

[population]
size = 4000
adversarial = 800
topic = "t0"

[strategies.honest]
pick_count = 16
bucket_count = 500
accept_cap = 20
fanout = "forward-to-relays"

[strategies.adversarial]
bucket_count = 500 # no pick_count: every valid edge is dialed
fanout = "silent-relay"

[execution]
runs_per_experiment = 400
