# pubsub-node configuration example
# Generated by: pubsub-admin bootstrap
# Consumed by:  pubsub-node --config <path>
#
# Precedence: CLI flag > this file > built-in default.
# Unknown keys (e.g. admin-only script refs) are silently ignored by the node.

network = "preprod"

# Topics to subscribe to at startup (node also auto-discovers via chain registry).
# topics = ["ops/emergency/critical", "gov/drep/test"]

# Gossip tuning
cyclon_interval = 5        # seconds between Cyclon gossip rounds
vicinity_interval = 10     # seconds between Vicinity gossip rounds
topic_refresh_interval = 300  # seconds between chain topic polls (0 = disabled)

log_level = "info"

# ── Cardano chain backend (Blockfrost) ────────────────────────────────────────
# blockfrost_url = "https://cardano-preprod.blockfrost.io/api/v0"
# blockfrost_key = "preprod..."

# ── Contract addresses — set by pubsub-admin bootstrap ───────────────────────
# topic_validator_addr = "addr_test1w..."
# publisher_vault_addr = "addr_test1w..."
# node_registry_addr   = "addr_test1w..."
# registry_policy_id   = "<56 hex chars>"

# ── Reference script UTxOs — set by pubsub-admin publish-scripts ─────────────
# (node does not read these; included so the same file works for admin tools)
# registry_mint_script_ref   = "<txhash>#0"
# topic_validator_script_ref = "<txhash>#0"
# publisher_vault_script_ref = "<txhash>#0"
