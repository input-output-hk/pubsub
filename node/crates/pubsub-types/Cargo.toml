[package]
name = "pubsub-types"
description = "Core types, message envelope, and trait definitions for Cardano PubSub"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enable the NodeRegistry trait and related types.
# Per D2 paper Ch.4: only replication servers register on-chain, not relay nodes.
# Gate this feature until the clique-DHT persistence layer is built.
replicate = []

[dependencies]
serde = { workspace = true }
ciborium = { workspace = true }
pallas-crypto = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
