[workspace]
resolver = "2"
members = [
    "crates/secure-cyclon",
    "crates/secure-cyclon-sim",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/input-output-hk/pubsub"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tracing = "0.1"
