name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the commit activity heatmap
      - name: Generate commit activity data
        run: |
          python3 - <<'EOF'
          import json, subprocess
          from collections import Counter
          dates = subprocess.run(
              ["git", "log", "--format=%as"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          counts = Counter(dates)
          with open("web/assets/commit-activity.json", "w") as f:
              json.dump({"counts": dict(sorted(counts.items())), "total": len(dates)}, f)
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
