name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'scripts/build-activity.py'
      - '.github/workflows/docs.yml'
  # The activity figures are generated at deploy time, so a quiet week would
  # leave them stale. Redeploy every Monday to keep them current.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read      # activity stats: closed-issue count and milestone progress
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for the commit activity heatmap
      - name: Generate commit activity data
        run: python3 scripts/build-activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - uses: actions/deploy-pages@v5
        id: deployment
