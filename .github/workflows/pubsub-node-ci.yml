name: pubsub-node CI

on:
  push:
    branches: [main]
    paths:
      - 'pubsub-node/**'
      - '.github/workflows/pubsub-node-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pubsub-node/**'
      - '.github/workflows/pubsub-node-ci.yml'

concurrency:
  group: pubsub-node-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / build / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pubsub-node
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, index and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pubsub-node -> target

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --all-targets --locked

      - name: cargo test
        run: cargo test --all-targets --locked
