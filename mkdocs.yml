site_name: Pubsub Documentation
site_description: Decentralized communication/messaging system for Cardano
site_url: https://input-output-hk.github.io/pubsub/

repo_name: input-output-hk/pubsub
repo_url: https://github.com/input-output-hk/pubsub

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Product:
    - Overview: product/index.md
  - Architecture:
    - Overview: architecture/index.md
