site_name: Cardano PubSub Documentation
site_description: The native communication layer for the Cardano ecosystem
site_url: https://input-output-hk.github.io/pubsub/

repo_name: input-output-hk/pubsub
repo_url: https://github.com/input-output-hk/pubsub

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Product:
    - Overview: product/index.md
    - Vision & Problem: product/vision.md
    - Requirements:
      - Overview: product/requirements/index.md
      - Functional: product/requirements/functional.md
      - Non-Functional: product/requirements/non-functional.md
    - Market Analysis: product/market.md
    - Roadmap: product/roadmap.md
    - Stakeholders & Team: product/stakeholders.md
    - Risks & Asks: product/risks.md
  - Use Cases:
    - Overview: use-cases/index.md
    - DeFi Intents: use-cases/defi-intents.md
    - Governance: use-cases/governance.md
    - Autonomous Agents: use-cases/autonomous-agents.md
    - Cross-Chain: use-cases/cross-chain.md
    - Token-Gated Social: use-cases/token-gated-social.md
  - Architecture:
    - Overview: architecture/index.md
    - Philosophy: architecture/philosophy.md
    - System Layers: architecture/layers.md
    - Development Strategy: architecture/development-strategy.md
    - Build vs Buy: architecture/build-vs-buy.md
  - Economics:
    - Overview: economics/index.md
  - Glossary: glossary.md
