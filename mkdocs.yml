site_name: Pubsub Documentation
site_description: Decentralized communication/messaging system for Cardano
site_url: https://input-output-hk.github.io/pubsub/

repo_name: input-output-hk/pubsub
repo_url: https://github.com/input-output-hk/pubsub

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Product:
    - Overview: product/index.md
    - Vision & Problem: product/vision.md
    - Requirements:
      - Overview: product/requirements/index.md
      - Functional: product/requirements/functional.md
      - Non-Functional: product/requirements/non-functional.md
    - Use Cases:
      - Overview: product/use-cases/index.md
      - Foundational: product/use-cases/foundational.md
      - Social & Community: product/use-cases/social.md
      - Commerce & Services: product/use-cases/commerce.md
      - AI & Agentic Systems: product/use-cases/ai-agents.md
      - Ecosystem Expansion: product/use-cases/ecosystem.md
    - Architecture Drivers: product/architecture.md
    - Market Analysis: product/market.md
    - Roadmap: product/roadmap.md
    - Stakeholders & Team: product/stakeholders.md
    - Risks & Asks: product/risks.md
  - Architecture:
    - Overview: architecture/index.md
    - Philosophy: architecture/philosophy.md
    - System Layers: architecture/layers.md
    - Use Case Coverage: architecture/use-case-coverage.md
    - Development Strategy: architecture/development-strategy.md
    - Build vs Buy: architecture/build-vs-buy.md
