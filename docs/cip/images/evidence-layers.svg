<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 506" width="860" height="506" role="img" aria-labelledby="t d">
<title id="t">The evidence in two layers</title>
<desc id="d">Two numbered layers read downward. Layer 1 compares all five candidate designs with the admission rules off: each design, one structural choice apart from another, is measured by two independently built instruments, analysis with closed-form coverage laws and measurement running the node's own logic under a deterministic scheduler, and their agreement is the argument. It selects M4, the symmetric relay link, compared at RF = 9. Layer 2 sizes the admission rules on the selected design: the bucket count, the serving cap and the pick count, arriving at the configuration specified, M4 at RF = 10 under the gate and the cap, whose numbers are Table 8's last row. The two layers name different configurations, and where a design's numbers differ the gated ones apply.</desc>
