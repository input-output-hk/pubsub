<line x1="285.5" y1="72.0" x2="307.5" y2="72.0" stroke="#eda100" stroke-width="2.2"/>
<circle cx="296.5" cy="72.0" r="4.4" fill="#eda100" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="314.5" y="76.0" font-size="10.5" fill="#eda100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">B = 50, attacker at 10 %</text>
<line x1="461.1" y1="72.0" x2="483.1" y2="72.0" stroke="#4a3aa7" stroke-width="2.2"/>
<circle cx="472.1" cy="72.0" r="4.4" fill="#4a3aa7" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="490.1" y="76.0" font-size="10.5" fill="#4a3aa7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">B = 50, attacker at 20 %</text>
<text x="104.0" y="92.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">B is the bucket count: the gate splits the population into B groups and a node may only link inside the group it draws, so K attacker identities reach any one victim as K/B.</text>
<text x="104.0" y="39.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">What the network delivers</text>
<text x="104.0" y="54.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">share of epochs in which every honest subscriber is reached · higher is better · bars are Wilson 95 %</text>
<text x="104.0" y="334.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Why</text>
<text x="104.0" y="349.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">honest dials refused for want of capacity, per run · log scale · lower is better</text>
<text x="462.0" y="568.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Serving cap — peers one node will accept</text>
<text x="38.0" y="590.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Raising the cap hands the attacker more of each victim's slots and still rescues the network: the harm is honest links starved of capacity,</text>
<text x="38.0" y="606.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">not slots lost to the adversary. A gate at B = 125 never reaches the failing regime at any cap tested.</text>
</svg>
