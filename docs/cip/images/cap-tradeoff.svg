<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" role="img" aria-labelledby="t d">
<title id="t">What the serving cap costs and what it rescues</title>
<desc id="d">Two stacked panels sharing a serving-cap axis. The upper panel is the share of epochs delivering full coverage, the lower the number of honest dials refused for want of capacity. Raising the cap increases the slots an attacker holds on each victim and simultaneously restores coverage, because the damage is honest links refused rather than slots taken. At a bucket count of 125 the network never enters the failing regime at any cap tested.</desc>
