<text x="223.3" y="526.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">6.8 · 11.1</text>
<text x="462.0" y="526.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">7.6 · 13.1</text>
<text x="700.7" y="526.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">15.5</text>
<text x="462.0" y="540.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">rising left to right — the attacker gains slots as the cap is raised</text>
<line x1="104.0" y1="72.0" x2="126.0" y2="72.0" stroke="#1e8f5e" stroke-width="2.6"/>
