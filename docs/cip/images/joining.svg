<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" height="286" role="img" aria-labelledby="jt jd">
<title id="jt">Joining as a node</title>
<desc id="jd">Five stages read left to right. Off chain, an operator generates a node identity key and holds an operator credential, and signs the registration proof of possession. On chain, a topic entry is created if the topic does not already exist, carrying an owner credential, a publisher set and a retention window of at least one epoch; this step is skipped for a topic that exists, and may share the registration transaction. Also on chain, the node entry is created, listing at least one registered topic, locking the deposit and optionally carrying endpoints. The entry then waits for the next registration cutoff, at which a snapshot of both registries is taken, strictly before that epoch's randomness is determined; an entry landing after a cutoff waits for the following epoch. From that epoch the node is counted among the registered peers on each topic it listed, the gate narrows those to the peers it may link with, and it opens its own picks and holds them for the epoch.</desc>

<rect width="960" height="286" rx="8" fill="#fcfcfb"/>

<!-- lanes -->
<rect x="30" y="34" width="150" height="26" rx="6" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="105" y="51" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Off chain</text>

<rect x="217" y="34" width="337" height="26" rx="6" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="385" y="51" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">On chain</text>

<rect x="591" y="34" width="337" height="26" rx="6" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="759" y="51" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Per epoch, and not before</text>

<!-- 1. keys -->
<rect x="30" y="78" width="150" height="122" rx="6" fill="#fcfcfb" stroke="#b9b6ab" stroke-width="1.4"/>
<circle cx="52" cy="100" r="11" fill="#1a1a19"/>
<text x="52" y="104" font-size="11.5" fill="#fcfcfb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="700">1</text>
<text x="70" y="104" font-size="12" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Generate keys</text>
<text x="46" y="132" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">node identity key</text>
<text x="46" y="151" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">operator credential</text>
<text x="46" y="170" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">proof of possession</text>
<text x="46" y="189" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">kept distinct</text>

<line x1="184" y1="139" x2="206" y2="139" stroke="#b9b6ab" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="213,139 206,135.5 206,142.5" fill="#b9b6ab"/>

<!-- 2. topic -->
<rect x="217" y="78" width="150" height="122" rx="6" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.4" stroke-dasharray="5 5"/>
<circle cx="239" cy="100" r="11" fill="#1a1a19"/>
<text x="239" y="104" font-size="11.5" fill="#fcfcfb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="700">2</text>
<text x="257" y="104" font-size="12" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Create the topic</text>
<text x="233" y="132" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">owner credential</text>
<text x="233" y="151" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">publisher set</text>
<text x="233" y="170" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">retention ≥ 1 epoch</text>
<text x="233" y="189" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">only if it is new</text>

<line x1="371" y1="139" x2="393" y2="139" stroke="#b9b6ab" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="400,139 393,135.5 393,142.5" fill="#b9b6ab"/>
<text x="385" y="215" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">one transaction may do both</text>
<path d="M 292 204 L 292 222 L 478 222 L 478 204" fill="none" stroke="#b9b6ab" stroke-width="1.2" stroke-dasharray="4 4"/>

<!-- 3. node -->
<rect x="404" y="78" width="150" height="122" rx="6" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.4"/>
<circle cx="426" cy="100" r="11" fill="#1a1a19"/>
<text x="426" y="104" font-size="11.5" fill="#fcfcfb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="700">3</text>
<text x="444" y="104" font-size="12" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Register the node</text>
<text x="420" y="132" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">topics of interest, ≥ 1</text>
<text x="420" y="151" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">deposit locked</text>
<text x="420" y="170" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">endpoints, optional</text>
<text x="420" y="189" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">each topic must exist</text>

<line x1="558" y1="139" x2="580" y2="139" stroke="#b9b6ab" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="587,139 580,135.5 580,142.5" fill="#b9b6ab"/>

<!-- 4. cutoff -->
<rect x="591" y="78" width="150" height="122" rx="6" fill="#fcfcfb" stroke="#b9b6ab" stroke-width="1.4"/>
<circle cx="613" cy="100" r="11" fill="#1a1a19"/>
<text x="613" y="104" font-size="11.5" fill="#fcfcfb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="700">4</text>
<text x="631" y="104" font-size="12" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Wait for the cutoff</text>
<text x="607" y="132" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">snapshot of both</text>
<text x="607" y="151" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">registries is taken</text>
<text x="607" y="170" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">strictly before η is fixed</text>
<text x="607" y="189" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">later entries wait</text>

<line x1="745" y1="139" x2="767" y2="139" stroke="#b9b6ab" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="774,139 767,135.5 767,142.5" fill="#b9b6ab"/>

<!-- 5. epoch -->
<rect x="778" y="78" width="150" height="122" rx="6" fill="#fcfcfb" stroke="#1e8f5e" stroke-width="1.4"/>
<circle cx="800" cy="100" r="11" fill="#1a1a19"/>
<text x="800" y="104" font-size="11.5" fill="#fcfcfb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="700">5</text>
<text x="818" y="104" font-size="12" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Take part</text>
<text x="794" y="132" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">counted on each topic</text>
<text x="794" y="151" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">the gate narrows it</text>
<text x="794" y="170" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">picks k, holds the links</text>
<text x="794" y="189" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">for that epoch</text>

<text x="30" y="266" font-size="10" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">A dashed box is conditional. Nothing in the topic entry depends on the node registry, so step 2 never waits on step 3.</text>
</svg>
