<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-labelledby="t d">
<title id="t">Deriving one node's links for one epoch</title>
<desc id="d">Three rows of markers over the same peers. The first row is every peer registered on the topic at the epoch's registration cutoff. The second marks those for which the verifiable gate holds, roughly one in B of them. The third marks the RF survivors the node actually picks, drawn with its own randomness. Survivor headroom is the ratio of the second row to the third, and this proposal requires it to be at least two. An acceptor checks registration, the gate, and its serving cap.</desc>
