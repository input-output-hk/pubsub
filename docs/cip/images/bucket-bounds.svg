<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 466" width="860" height="466" role="img" aria-labelledby="t d">
<title id="t">What each bucket-count rule delivers, against topic size</title>
<desc id="d">The failure probability reached by two ways of sizing the bucket count. Taking the smallest of the three bounds the Specification states holds the failure probability at the target across the whole range. Reading only the selection-headroom floor, as earlier drafts did, misses the target above a few thousand participants, and at twenty thousand participants with nine picks it misses it by roughly two orders of magnitude.</desc>
