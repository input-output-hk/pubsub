<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="t d">
<title id="t">What a failing draw costs, against how often draws fail</title>
<desc id="d">One point per cell of the adversarial-fraction sweep. The horizontal axis is the failure rate measured in that cell, on a log scale; the vertical axis is the share of those failures that missed exactly one honest subscriber. The share stays at or near 100 % until the failure rate is far above anything this proposal targets, and falls to 76 % only at a rate of 0.4. Two cells, ringed, also produced a single draw in which every subscriber was missed because the publisher itself was cut off.</desc>
