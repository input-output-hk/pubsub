<text x="85.0" y="255.5" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">12</text>
<line x1="96.0" y1="153.1" x2="820.0" y2="153.1" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="85.0" y="157.1" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">16</text>
<line x1="96.0" y1="54.6" x2="820.0" y2="54.6" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="85.0" y="58.6" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">20</text>
<line x1="199.4" y1="256.5" x2="578.7" y2="310.6" stroke="#1e8f5e" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>
<text x="389.0" y="272.5" font-size="11" fill="#1e8f5e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">nothing beats both</text>
<circle cx="578.7" cy="310.6" r="11.5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="578.7" y="289.1" font-size="12" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">M3 · RF=12, s=8</text>
<circle cx="199.4" cy="256.5" r="7.4" fill="#eda100" stroke="#fcfcfb" stroke-width="1.6"/>
