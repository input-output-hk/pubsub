<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 472" width="860" height="472" role="img" aria-labelledby="t d">
<title id="t">Three costs at each design's proposed configuration</title>
<desc id="d">Each design shown at the configuration this proposal names for it. Three quantities are plotted at once: the horizontal axis is standing connections per node, the vertical axis is message copies per honest node, and marker size is hops to full coverage. Both axes are costs, so lower and further left is better, and a smaller marker reaches the last subscriber sooner. M3 and M4 are jointly non-dominated on the two axes.</desc>
