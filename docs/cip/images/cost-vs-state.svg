<text x="0" y="0" transform="translate(41,198.0) rotate(-90)" text-anchor="middle" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">up = more traffic</text>
</svg>
