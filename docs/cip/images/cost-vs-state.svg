<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="t d">
<title id="t">Bandwidth cost against state cost at equal safety</title>
<desc id="d">Each design tuned to the same failure target, so points differ only in cost. Horizontal axis is standing connections per node, vertical axis is message copies per honest node; both are costs, so lower-left is better. M3 and M4 are jointly non-dominated.</desc>
<rect width="860" height="430" rx="8" fill="#fcfcfb"/>
<line x1="96.0" y1="30.0" x2="96.0" y2="350.0" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="96.0" y="369.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">10</text>
<line x1="268.4" y1="30.0" x2="268.4" y2="350.0" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="268.4" y="369.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">20</text>
<line x1="440.8" y1="30.0" x2="440.8" y2="350.0" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="440.8" y="369.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">30</text>
<line x1="613.1" y1="30.0" x2="613.1" y2="350.0" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="613.1" y="369.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">40</text>
<line x1="785.5" y1="30.0" x2="785.5" y2="350.0" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="785.5" y="369.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">50</text>
<line x1="96.0" y1="350.0" x2="820.0" y2="350.0" stroke="#e2e0d8" stroke-width="1.0"/>
<text x="85.0" y="354.0" font-size="11.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">8</text>
