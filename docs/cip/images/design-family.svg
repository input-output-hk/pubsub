<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 636" width="860" height="636" role="img" aria-labelledby="t d">
<title id="t">The five dissemination designs</title>
<desc id="d">Three numbered bands read downward, one card per design, each card showing one node and three of its peers. Band 1 holds the primitives, which cover one link direction each: under M1, push, a node forwards to targets it drew, and a node nobody drew cannot receive; under M2, pull, a node draws its forwarders, and a publisher nobody drew cannot be heard. Each meets the failure target at 24 picks. Band 2 covers both directions by adding a second link kind: M5 runs push and pull at once at 9 plus 8 picks; M3 keeps pull relays and adds seeding links carrying only their owner's publications, at 13 plus 6 picks. Either failure remains open, each resting on one condition. Band 3 merges the two sets into one bidirectional link kind: M4, the design the Specification fixes, reaches the same target at 9 picks and is cut off only when both conditions fail at once.</desc>
