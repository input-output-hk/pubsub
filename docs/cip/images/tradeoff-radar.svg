<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 616" width="860" height="616" role="img" aria-labelledby="t d">
<title id="t">Four-way trade-off across the surviving designs</title>
<desc id="d">One radar chart overlaying M2, M3, M4 and M5 on four axes: bandwidth economy, connection economy, speed and churn tolerance, all oriented outward-is-better. Each is labelled at the axis where it reaches the outer ring. M3 is a narrow spike reaching the outer ring only on bandwidth; M4 is the most even shape; M5 leads on churn tolerance and speed.</desc>
