<circle cx="430.0" cy="436.9" r="4.2" fill="#eda100" stroke="#fcfcfb" stroke-width="1.6"/>
<circle cx="268.0" cy="282.0" r="4.2" fill="#eda100" stroke="#fcfcfb" stroke-width="1.6"/>
<polygon points="430.0,194.2 490.8,282.0 430.0,444.0 392.9,282.0" fill="#4a3aa7" fill-opacity="0.13" stroke="#4a3aa7" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="430.0" cy="194.2" r="4.2" fill="#4a3aa7" stroke="#fcfcfb" stroke-width="1.6"/>
<circle cx="490.8" cy="282.0" r="4.2" fill="#4a3aa7" stroke="#fcfcfb" stroke-width="1.6"/>
<circle cx="430.0" cy="444.0" r="4.2" fill="#4a3aa7" stroke="#fcfcfb" stroke-width="1.6"/>
<circle cx="392.9" cy="282.0" r="4.2" fill="#4a3aa7" stroke="#fcfcfb" stroke-width="1.6"/>
<text x="430.0" y="98.0" font-size="12.5" fill="#008300" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="650">M3 · RF=13, s=7</text>
<text x="430.0" y="62.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Bandwidth economy</text>
<text x="430.0" y="77.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">copies per node</text>
<text x="430.0" y="48.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">M3 10.4 · M4 13.4 · M2 19.2</text>
<text x="612.0" y="260.0" font-size="12.5" fill="#eda100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="650">M4 · RF=9</text>
<text x="612.0" y="278.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Connection economy</text>
<text x="612.0" y="293.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">standing links</text>
<text x="612.0" y="307.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">M3 38 · M4 18 · M2 48</text>
<text x="430.0" y="470.0" font-size="12.5" fill="#4a3aa7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="650">M2 · RF=24</text>
<text x="430.0" y="492.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Speed</text>
<text x="430.0" y="507.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">hops to last subscriber</text>
<text x="430.0" y="521.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">M3 5.51 · M4 5.0 · M2 4.78</text>
<text x="248.0" y="260.0" font-size="12.5" fill="#eda100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end" font-weight="650">M4 · RF=9</text>
<text x="248.0" y="278.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end" font-weight="600">Churn tolerance</text>
<text x="248.0" y="293.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">downtime absorbed</text>
<text x="248.0" y="307.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="end">M3 2.17 · M4 7.43 · M2 1.7</text>
<text x="38.0" y="556.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Every axis is oriented so that outward is better: less bandwidth used, fewer connections held, fewer hops to the last subscriber, more downtime absorbed.</text>
<text x="38.0" y="572.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Each design is scored against the best of the three and labelled at the axis where it leads.</text>
<text x="38.0" y="588.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Three axes are measured directly; churn tolerance is read off the coverage law, whose behaviour under churn was measured separately.</text>
</svg>
