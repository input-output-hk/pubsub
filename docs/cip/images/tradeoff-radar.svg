<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="t d">
<title id="t">Four-way trade-off across the non-dominated designs</title>
<desc id="d">Four small radar charts, one per design, on the axes bandwidth, connections, latency and churn tolerance. Each design is best on exactly one axis: M3 bandwidth, M4 connections, M5 churn tolerance, M2 latency. M3 shows the most uneven shape and M4 the most even. The churn axis is predicted rather than measured.</desc>
<rect width="900" height="700" rx="8" fill="#fcfcfb"/>
<text x="38.0" y="30.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">All four axes are oriented so that outward is better: further out means less bandwidth used, fewer connections held, fewer hops to the last subscriber,</text>
<text x="38.0" y="46.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">and more honest downtime absorbed. Each is scored against the best of the four. Grey shapes are the other three designs, for comparison; the churn axis is</text>
<text x="38.0" y="62.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">predicted from the coverage laws rather than measured.</text>
