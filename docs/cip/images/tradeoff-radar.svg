<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" role="img" aria-labelledby="t d">
<title id="t">Four-way trade-off between the surviving candidates</title>
<desc id="d">Radar chart on four axes: bandwidth economy, connection economy, latency and churn tolerance. Each design is scored against the best of the three on each axis, so a larger polygon is better. M3 reaches the outer ring on bandwidth but sits innermost on connections and churn tolerance; M4 is the more even shape; M2 is shown as a reference. The churn axis is predicted rather than measured.</desc>
