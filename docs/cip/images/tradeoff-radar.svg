<line x1="430.0" y1="282.0" x2="592.0" y2="282.0" stroke="#e2e0d8" stroke-width="1"/>
<line x1="430.0" y1="282.0" x2="430.0" y2="444.0" stroke="#e2e0d8" stroke-width="1"/>
<line x1="430.0" y1="282.0" x2="268.0" y2="282.0" stroke="#c4c2b9" stroke-width="1" stroke-dasharray="4 4"/>
<polygon points="430.0,120.0 506.7,282.0 430.0,422.5 382.7,282.0" fill="#008300" fill-opacity="0.13" stroke="#008300" stroke-width="2.4" stroke-linejoin="round"/>
<circle cx="430.0" cy="120.0" r="4.2" fill="#008300" stroke="#fcfcfb" stroke-width="1.6"/>
<circle cx="506.7" cy="282.0" r="4.2" fill="#008300" stroke="#fcfcfb" stroke-width="1.6"/>
