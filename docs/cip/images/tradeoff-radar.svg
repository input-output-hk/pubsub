<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610" role="img" aria-labelledby="t d">
<title id="t">Four-way trade-off across the four non-dominated designs</title>
<desc id="d">One radar chart overlaying M2, M3, M4 and M5 on four axes: bandwidth economy, connection economy, speed and churn tolerance, all oriented outward-is-better. Each is labelled at the axis where it reaches the outer ring. M3 is a narrow spike reaching the outer ring only on bandwidth; M4 is the most even shape; M5 leads on churn tolerance and speed. The churn axis is predicted rather than measured.</desc>
<rect width="860" height="610" rx="8" fill="#fcfcfb"/>
<text x="38.0" y="30.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Every axis is oriented so that outward is better: less bandwidth used, fewer connections held, fewer hops to the last subscriber, more downtime absorbed.</text>
<text x="38.0" y="46.0" font-size="11" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-style="italic">Each design is scored against the best of the four, and labelled at the axis where it leads. The churn axis is predicted, not measured.</text>
