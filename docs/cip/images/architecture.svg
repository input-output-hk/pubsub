<text x="430.0" y="114.0" font-size="11.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Topic registry</text>
<text x="430.0" y="130.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">topic identifier</text>
<text x="430.0" y="143.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">authorised publisher keys</text>
<rect x="564.0" y="92.0" width="236.0" height="62.0" rx="6" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.4"/>
<text x="682.0" y="114.0" font-size="11.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Randomness beacon</text>
<text x="682.0" y="130.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">one value per epoch</text>
<text x="682.0" y="143.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">fixed after the registration cutoff</text>
