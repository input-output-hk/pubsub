<polygon points="640.0,239.0 633.0,242.5 633.0,235.5" fill="#b9b6ab"/>
<text x="60.0" y="282.0" font-size="10" fill="#4a3aa7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Recomputable by anyone holding the chain</text>
<text x="304.0" y="282.0" font-size="10" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">→</text>
<text x="324.0" y="282.0" font-size="10" fill="#1e8f5e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">the node's own draw, and not required to be checkable</text>
<line x1="430.0" y1="296.0" x2="430.0" y2="325.0" stroke="#b9b6ab" stroke-width="1.6" stroke-linecap="round"/>
