<rect x="38.0" y="210.0" width="784.0" height="150.0" rx="8" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="58.0" y="234.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">In every node, from those inputs alone</text>
<text x="58.0" y="250.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">no negotiation, no discovery layer, no peer's word taken for anything</text>
<rect x="60.0" y="266.0" width="158.0" height="62.0" rx="6" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.4"/>
<text x="139.0" y="288.0" font-size="11.5" fill="#4a3aa7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Registered peers</text>
<text x="139.0" y="304.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">every node registered</text>
<text x="139.0" y="317.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">on the topic</text>
<rect x="254.0" y="266.0" width="158.0" height="62.0" rx="6" fill="#fcfcfb" stroke="#4a3aa7" stroke-width="1.4"/>
<text x="333.0" y="288.0" font-size="11.5" fill="#4a3aa7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Verifiable gate</text>
<text x="333.0" y="304.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">H(d, η, T, a, b) mod B = 0</text>
<text x="333.0" y="317.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">leaves the eligible set</text>
<rect x="448.0" y="266.0" width="158.0" height="62.0" rx="6" fill="#fcfcfb" stroke="#1e8f5e" stroke-width="1.4"/>
<text x="527.0" y="288.0" font-size="11.5" fill="#1e8f5e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle" font-weight="600">Pick</text>
<text x="527.0" y="304.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">k of them drawn</text>
<text x="527.0" y="317.0" font-size="9.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">by the node's own randomness</text>
