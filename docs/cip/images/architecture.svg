<polygon points="430.0,170.0 426.5,163.0 433.5,163.0" fill="#b9b6ab"/>
<text x="440.0" y="156.0" font-size="10" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">publisher keys</text>
<line x1="682.0" y1="134.0" x2="682.0" y2="163.0" stroke="#b9b6ab" stroke-width="1.6" stroke-linecap="round"/>
