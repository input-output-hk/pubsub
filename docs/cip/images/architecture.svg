<text x="440.0" y="394.0" font-size="10" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">one signed handshake per link, up to the serving cap C</text>
<rect x="38.0" y="416.0" width="784.0" height="120.0" rx="8" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="58.0" y="440.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Over those links, until the epoch ends</text>
