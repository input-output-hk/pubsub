<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 492" width="860" height="492" role="img" aria-labelledby="t d">
<title id="t">The protocol at a glance</title>
<desc id="d">Three numbered bands read downward. Band 1, the Cardano chain, holds a node registry, a topic registry and a per-epoch randomness beacon, contributing membership, publisher keys and the epoch randomness respectively. Every node turns those public inputs into its registered peers on a topic, applies the verifiable gate, picks from the survivors with its own private randomness, and holds the resulting links for the epoch; the steps up to the gate are recomputable by anyone holding the chain and the pick is not. Messages then travel over those links from publisher through any number of relays to subscribers, signed once end to end.</desc>
