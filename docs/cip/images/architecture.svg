<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 574" width="860" height="574" role="img" aria-labelledby="t d">
<title id="t">The protocol at a glance</title>
<desc id="d">Three bands read downward. The Cardano chain holds a node registry, a topic registry and a per-epoch randomness beacon. Every node turns those public inputs into the same candidate set, applies the verifiable gate to obtain its survivors, picks from them with its own randomness, and holds the resulting links for the epoch. Messages then travel over those links from publisher through relays to subscribers, signed once end to end.</desc>
<rect width="860" height="574" rx="8" fill="#fcfcfb"/>
<rect x="38.0" y="38.0" width="784.0" height="128.0" rx="8" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="58.0" y="62.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">On the Cardano chain</text>
<text x="58.0" y="78.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">the trust root — public, and the same for everyone</text>
