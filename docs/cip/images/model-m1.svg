<text x="58.0" y="386.0" font-size="10.5" fill="#52514e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">messages flow with the arrows: this node forwards everything it holds to its targets, and receives only what its upstream layer sends.</text>
