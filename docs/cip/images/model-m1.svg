<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 396" width="860" height="396" role="img" aria-labelledby="t d">
<title id="t">One node's links under M1</title>
<desc id="d">Three layers. The top layer holds peers whose own draws included this node; they initiate those links and the node has no say in them. The middle is the node itself. The bottom layer holds the F targets the node drew; it initiates these. Messages flow downward along the arrows, so a node nobody drew has an empty top layer and cannot receive.</desc>
<rect width="860" height="396" rx="8" fill="#fcfcfb"/>
<rect x="38.0" y="34.0" width="784.0" height="112.0" rx="8" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="58.0" y="60.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Upstream</text>
<text x="58.0" y="78.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">they initiate: nodes whose own draw happened to include this one</text>
<rect x="38.0" y="250.0" width="784.0" height="112.0" rx="8" fill="#fcfcfb" stroke="#e2e0d8" stroke-width="1.2"/>
<text x="58.0" y="276.0" font-size="12.5" fill="#1a1a19" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-weight="600">Downstream</text>
<text x="58.0" y="294.0" font-size="10.5" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">this node initiates: the F targets it drew</text>
