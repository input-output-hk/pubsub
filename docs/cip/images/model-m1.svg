<text x="596.0" y="96.0" font-size="10" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">not chosen by this node: one that</text>
<text x="596.0" y="110.0" font-size="10" fill="#8a887e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">nobody drew cannot receive</text>
